# Runs on every PR: member-section rules, PR scope, type/data check, build, page-weight budget.
# The same checks run locally with `npm run build` (scope check needs BASE_REF).
name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # npm ci rejects a lockfile made on Windows (Linux-only optional deps missing); install still honours the lock.
      - run: npm install --no-audit --no-fund
      - name: PR scope (one member, own files only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
          # Maintainers add the `core` label to PRs that change the site itself.
          ALLOW_CORE: ${{ contains(github.event.pull_request.labels.*.name, 'core') && '1' || '0' }}
        run: node scripts/check-custom.mjs --scope
      - name: Rules, types, build, budgets
        run: npm run build
      # Deploy to Cloudflare (Workers static assets) only from main, after every check passed.
      # Needs repo secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit) and CLOUDFLARE_ACCOUNT_ID.
      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo '沒有 CLOUDFLARE_API_TOKEN，略過部署'; exit 0; fi
          npx wrangler deploy
      - name: Smoke test the live site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          base=https://ifalab-ncu.com
          for p in /zh-tw/ /en/ /zh-tw/research/ /zh-tw/papers/disposition-options/ /llms.txt /robots.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 10 --retry-all-errors "$base$p")
            echo "$code $p"; [ "$code" = 200 ] || exit 1
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' "$base/no-such-page/"); echo "$code /no-such-page/ (want 404)"; [ "$code" = 404 ]
      # Everything a search engine, a browser and a share preview expect: redirects, headers, icons, manifest, sitemap,
      # every page's head tags and structured data, every internal link and image (scripts/audit-live.mjs). FAIL stops here.
      - name: Audit the live site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/audit-live.mjs https://ifalab-ncu.com
      # Tell Bing (and the AI answer engines built on its index) which pages changed: IndexNow, key file in public/.
      - name: IndexNow
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          urls=$(curl -s https://ifalab-ncu.com/sitemap-0.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -s -c .)
          body=$(jq -n -c --argjson u "$urls" '{host:"ifalab-ncu.com",key:"ac905f92f3464766c6cf50f88ddf13e9",keyLocation:"https://ifalab-ncu.com/ac905f92f3464766c6cf50f88ddf13e9.txt",urlList:$u}')
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json; charset=utf-8' -d "$body" https://api.indexnow.org/indexnow)
          echo "IndexNow: $code"
